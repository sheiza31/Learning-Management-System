services:
  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - lms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # MinIO (S3-compatible Object Storage)
  # Temporarily disabled — image unavailable from all registries
  # Uncomment when MinIO image is accessible again
  # ──────────────────────────────────────────
  # minio:
  #   image: quay.io/minio/minio:latest
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - miniodata:/data
  #   networks:
  #     - lms-network

  # ──────────────────────────────────────────
  # Backend (Go API)
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: lms_user
      DB_PASSWORD: lms_password
      DB_NAME: lms_db
      DB_SSLMODE: disable
      JWT_SECRET: super-secret-dev-key-change-in-production
      JWT_ISSUER: lms-api
      JWT_ACCESS_TTL: 15m
      CORS_ORIGINS: http://localhost:3001,http://localhost:3000,http://localhost:5173
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms-network

  # ──────────────────────────────────────────
  # Frontend (React Router / Vite)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes these at build time — only build args are needed, not runtime env
        VITE_API_URL: http://localhost:8081/api/v1
        VITE_API_BASE_URL: http://localhost:8081/api/v1
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - lms-network

volumes:
  pgdata:
  # miniodata:  # Re-enable with MinIO service

networks:
  lms-network:
    driver: bridge
